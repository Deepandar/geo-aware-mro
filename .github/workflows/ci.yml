name: geo-aware-mro-ci

on:

  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

env:
  PYTHON_VERSION: "3.10"

jobs:

# =====================================================
# LINT JOB
# =====================================================

  lint:

    name: Ruff + Black

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Lint Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff
        run: |
          ruff check src tests

      - name: Run Black
        run: |
          black --check src tests

# =====================================================
# TEST JOB
# =====================================================

  test:

    name: Regression Suite

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4

        with:
          path: ~/.cache/pip

          key: >
            ${{ runner.os }}-pip-
            ${{ hashFiles('requirements-ci.txt') }}

          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run Tests
        run: |
          pytest src/ tests/ \
          --ignore=src/llm/streamlit_ui.py \
          --ignore=src/simulation/bullwhip_visualizer.py \
          --ignore=src/optimization/dp_visualizer.py

# =====================================================
# DOCKER JOB
# =====================================================

  docker:

    name: Docker Validation

    runs-on: ubuntu-latest

    needs:
      - test

    timeout-minutes: 30

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t geo-aware-mro .
